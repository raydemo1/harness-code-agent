[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriforge"
version = "0.1.0"
description = "VeriForge — verifiable local coding-agent runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "playwright>=1.40.0",
    "psutil>=5.9.8,<8",
    "textual>=0.89,<1",
    "mcp>=1.0.0",
    "BM25>=0.3,<1",
]

[project.optional-dependencies]
eval = [
    "datasets>=5.0.0",
    "pyarrow>=21.0.0",
    "harbor>=0.13; python_version >= '3.12'",
]

[project.scripts]
veriforge = "harness_code_agent.cli:main"

[tool.setuptools.packages.find]
include = ["harness_code_agent*"]
