[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-code-agent"
version = "0.1.0"
description = "Interactive local coding agent runtime"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "playwright>=1.40.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
hca = "harness_code_agent.cli:main"
